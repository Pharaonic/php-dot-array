name: Feature request
description: Suggest an idea or improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work? This package focuses on dot-notation paths and wildcards; collection-style helpers are out of scope.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds you have considered.
  - type: textarea
    id: example-api
    attributes:
      label: Example API
      description: How the feature would look in code.
      render: php
